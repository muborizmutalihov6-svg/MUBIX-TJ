if(g)return`<fieldset class="fd"><legend class="lb" ${D(f.l)}></legend><div class="op">`+f.o.map((o,i)=>`<label><input type="${f.k=='r'?'radio':'checkbox'}" name="${f.id}" value="${f.id=='lang'?LN[i]:o}"><span ${D(o)}></span></label>`).join('')+'</div></fieldset>';
const inp=f.k=='a'?`<textarea name="${f.id}" rows="6"></textarea>`:`<input name="${f.id}" type="${f.k=='t'?'text':f.k}"${f.k=='tel'?' inputmode="tel" autocomplete="tel"':''}${f.id=='name'?' autocomplete="name"':''}>`;
return`<label class="fd"><span class="lb" ${D(f.l)}></span>${inp}</label>`}
ST.forEach((s,i)=>{const e=document.createElement('section');e.className='st';e.innerHTML=`<h3 ${D(s[0])}></h3>`+s[1].map(fld).join('')+(i==7?`<dl class="sm" id="sm"></dl><p style="margin-bottom:16px;color:var(--mut)" ${D('Маълумотро санҷед ва тугмаро пахш кунед. WhatsApp бо паёми омода кушода мешавад — шумо онро худатон мефиристед.|Проверьте данные и нажмите кнопку. WhatsApp откроется с готовым сообщением — вы отправляете его сами.|Review your details and press the button. WhatsApp opens with the message ready; you send it yourself.')}></p><a class="btn wa big" id="wab" target="_blank" rel="noopener"><svg class="i"><use href="#wa"/></svg><span ${D('ФИРИСТОДАНИ ФАРМОИШ ТАВАССУТИ WHATSAPP|ОТПРАВИТЬ ЗАКАЗ В WHATSAPP|SEND ORDER VIA WHATSAPP')}></span></a>`:'');$('#fm').append(e)});

function data(){const d={};$$('#fm [name]').forEach(e=>{if(e.type=='radio'){if(e.checked)d[e.name]=e.value}else if(e.type=='checkbox'){if(e.checked)(d[e.name]=d[e.name]||[]).push(e.value)}else d[e.name]=e.value.trim()});d.lang=lang;return d}
function rows(d){const r=[];ST.forEach(s=>s[1].forEach(f=>{let v=d[f.id];if(!v||!v.length)return;v=Array.isArray(v)?v.map(P).join(', '):f.id=='lang'?f.o[LN.indexOf(v)]:f.k=='r'?P(v):v;r.push([P(f.l),v])}));return r}
function msg(){const H=['Фармоиши нави вебсайт — MUBIX TJ','Новый заказ сайта — MUBIX TJ','New website order — MUBIX TJ'][LN.indexOf(lang)];return H+'\n\n'+rows(data()).map(a=>'*'+a[0]+':* '+a[1]).join('\n')}
const wl=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
function sum(){$('#sm').innerHTML=rows(data()).map(a=>`<dt>${esc(a[0])}</dt><dd>${esc(a[1])}</dd>`).join('');$('#wab').href=wl(msg())}
$('#wab').onclick=()=>{$('#wab').href=wl(msg())};

function ok(i){const d=data();let m='';
for(const f of ST[i][1]){const v=d[f.id];
if(f.r&&(!v||!v.length)){m=E1;break}
if(f.k=='tel'&&v.replace(/\D/g,'').length<7){m=E2;break}
if(f.k=='email'&&v&&!/^\S+@\S+\.\S+$/.test(v)){m=E3;break}}
$('#er').dataset.t=m;$('#er').textContent=m?P(m):'';return!m}
function go(i,sc){cur=i;$$('.st').forEach((e,j)=>e.classList.toggle('on',j==i));$('#pb').style.width=(i+1)/8*100+'%';$('#sn').textContent=(i+1)+' / 8';$('#bk').style.visibility=i?'visible':'hidden';$('#nx').style.display=i==7?'none':'';$('#er').textContent='';$('#er').dataset.t='';$$('#stl li').forEach((e,j)=>{e.classList.toggle('on',j==i);e.classList.toggle('dn',j<i)});if(i==7)sum();if(sc)$('#order').scrollIntoView()}
$('#nx').onclick=()=>{if(ok(cur))go(cur+1,1)};
$('#bk').onclick=()=>go(cur-1,1);
$('#fm').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName!='TEXTAREA'){e.preventDefault();if(cur<7&&ok(cur))go(cur+1,1)}});
$('#fm').addEventListener('change',e=>{if(e.target.name=='lang')setLang(e.target.value)});

function applyLang(){document.documentElement.lang=lang;document.title=P('MUBIX TJ — Вебсайт барои тиҷорат|MUBIX TJ — Сайты для бизнеса|MUBIX TJ — Websites for business');
$$('[data-t]').forEach(e=>e.textContent=P(e.dataset.t));
$$('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==lang));
const r=$(`input[name=lang][value=${lang}]`);if(r)r.checked=true;if(cur==7)sum();rvS()}
function setLang(l){lang=l;try{localStorage.setItem('mb',l)}catch(e){}applyLang()}
$$('.lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

$('#bg').onclick=()=>{const o=$('#nv').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
$$('#nv a').forEach(a=>a.onclick=()=>{$('#nv').classList.remove('open');$('#bg').setAttribute('aria-expanded',false)});

$('#cf').onsubmit=e=>{e.preventDefault();const f=e.target,n=f.n.value.trim(),p=f.p.value.trim(),m=f.m.value.trim(),er=$('#ce');
if(!n||p.replace(/\D/g,'').length<7){er.dataset.t=E1;er.textContent=P(E1);return}
er.dataset.t='';er.textContent='';
const t='MUBIX TJ\n*'+P('Ному насаб|Имя и фамилия|Full name')+':* '+n+'\n*'+P('Рақами телефон|Номер телефона|Phone number')+':* '+p+(m?'\n*'+P('Паём|Сообщение|Message')+':* '+m:'');
window.open(wl(t),'_blank','noopener')};

if(EMAIL){$('#em').hidden=false;$('#ea').textContent=EMAIL;$('#ea').href='mailto:'+EMAIL}
$('#yr').textContent=new Date().getFullYear();
const cv=$('#sky'),cx=cv.getContext('2d'),R=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,SS=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;SS=Array.from({length:Math.min(150,W/7|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,v:Math.random()*.2+.04,a:Math.random()*6}))}
function dr(){cx.clearRect(0,0,W,H);cx.fillStyle='#d6c4ff';for(const s of SS){if(!R){s.y+=s.v;s.a+=.012;if(s.y>H)s.y=0}cx.globalAlpha=.3+.4*Math.abs(Math.sin(s.a));cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()}if(!R)requestAnimationFrame(dr)}
rs();dr();addEventListener('resize',()=>{rs();if(R)dr()});
$('#stl').innerHTML=ST.map(s=>`<li><button type="button" ${D(s[0])}></button></li>`).join('');
$('#stl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=$$('#stl button').indexOf(b);if(i<cur)go(i)};
$('#ty').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=$$('input[name=type]').find(x=>x.value==TY[+b.dataset.i][0]);if(r){r.checked=true;go(2,1)}};
$('#r1').onclick=()=>$('#ty').scrollBy({left:-320,behavior:'smooth'});
$('#r2').onclick=()=>$('#ty').scrollBy({left:320,behavior:'smooth'});
function rvS(){const e=$('#rv');e.innerHTML=P(e.dataset.t).split(' ').map(w=>`<span>${esc(w)}</span>`).join(' ');onS()}
function onS(){const d=document.documentElement,m=d.scrollHeight-innerHeight;$('#sp').style.width=(m>0?scrollY/m*100:0)+'%';
const t=$('#hw').getBoundingClientRect();$('#fl').style.height=Math.min(1,Math.max(0,(innerHeight*.6-t.top)/t.height))*100+'%';
$$('#hw li').forEach(l=>l.classList.toggle('on',R||l.getBoundingClientRect().top<innerHeight*.62));
const e=$('#rv'),r=e.getBoundingClientRect(),k=Math.min(1,Math.max(0,(innerHeight*.85-r.top)/(r.height+innerHeight*.3))),w=$$('span',e);w.forEach((x,i)=>x.classList.toggle('on',R||i<k*w.length*1.08))}
addEventListener('scroll',onS,{passive:true});addEventListener('resize',onS);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
$$('.rv').forEach(e=>io.observe(e));
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.cd');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--x',e.clientX-r.left+'px');c.style.setProperty('--y',e.clientY-r.top+'px')}});
go(0);applyLang();
</script>
</body>
</html>
